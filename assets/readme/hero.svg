<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">PACT: provable agent work and settlement</title>
  <desc id="desc">A dark technical hero showing funded work becoming evidence, a bounded verdict, settlement, and a finalized Trust Score.</desc>

  <defs>
    <radialGradient id="ember" cx="0" cy="0" r="1" gradientTransform="translate(1030 205) rotate(90) scale(260 360)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#CB673F" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#CB673F" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#F5F4F3" stroke-opacity="0.045"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#CB673F"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="26" fill="#080808"/>
  <rect width="1200" height="400" rx="26" fill="url(#grid)"/>
  <ellipse cx="1030" cy="206" rx="330" ry="250" fill="url(#ember)"/>
  <path d="M625 48V352" stroke="#F5F4F3" stroke-opacity="0.11"/>

  <g transform="translate(62 52)" fill="#F5F4F3">
    <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" letter-spacing="2.4" fill="#CB673F">AGENT WORK / SETTLEMENT / TRUST</text>
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="88" font-weight="700" letter-spacing="5">PACT</text>
    <text x="0" y="151" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="600">Provable Agent Contract &amp; Trust</text>
    <text x="0" y="205" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#E4E3E3">Fund an outcome. Collect evidence.</text>
    <text x="0" y="235" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" fill="#E4E3E3">Settle only when the result is final.</text>

    <g transform="translate(0 268)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600" letter-spacing="1.2">
      <rect width="142" height="38" rx="4" fill="#251C18" stroke="#914425"/>
      <text x="16" y="25" fill="#E58A61">ARC TESTNET</text>
      <rect x="154" width="82" height="38" rx="4" fill="#251C18" stroke="#914425"/>
      <text x="174" y="25" fill="#E58A61">USDC</text>
      <rect x="248" width="162" height="38" rx="4" fill="#251C18" stroke="#914425"/>
      <text x="264" y="25" fill="#E58A61">FINALITY-GATED</text>
    </g>
  </g>

  <g transform="translate(681 51)">
    <text x="0" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="600" letter-spacing="2.2" fill="#A39D99">OUTCOME PIPELINE</text>

    <g transform="translate(0 49)">
      <rect width="173" height="66" rx="5" fill="#0E0D0C" stroke="#CB673F" stroke-width="2"/>
      <text x="20" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#F5F4F3">FUNDED WORK</text>
      <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#A39D99">brief + budget + criteria</text>
    </g>

    <path d="M183 82H244" stroke="#CB673F" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(255 49)">
      <rect width="173" height="66" rx="5" fill="#0E0D0C" stroke="#E4E3E3" stroke-opacity="0.56" stroke-width="2"/>
      <text x="20" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#F5F4F3">EVIDENCE</text>
      <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#A39D99">deliverable + receipt</text>
    </g>

    <path d="M341 126V156" stroke="#CB673F" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M86 126V156" stroke="#CB673F" stroke-width="2"/>
    <path d="M86 156H341" stroke="#CB673F" stroke-width="2"/>

    <g transform="translate(92 166)">
      <rect width="249" height="76" rx="5" fill="#251C18" stroke="#CB673F" stroke-width="2"/>
      <circle cx="30" cy="38" r="13" fill="#CB673F"/>
      <path d="M24 38L29 43L38 32" fill="none" stroke="#080808" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="56" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="700" fill="#F5F4F3">FINALITY GATE</text>
      <text x="56" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#E58A61">NO_FAULT · PARTIAL · FULL</text>
    </g>

    <path d="M154 250V270" stroke="#CB673F" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M278 250V270" stroke="#CB673F" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(0 280)">
      <rect width="173" height="48" rx="5" fill="#0E0D0C" stroke="#914425"/>
      <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#F5F4F3">SETTLEMENT</text>
    </g>
    <g transform="translate(255 280)">
      <rect width="173" height="48" rx="5" fill="#0E0D0C" stroke="#914425"/>
      <text x="20" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#F5F4F3">TRUST SCORE</text>
    </g>
  </g>
</svg>
