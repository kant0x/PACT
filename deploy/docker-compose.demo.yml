services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pact
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pact-demo-only}
    volumes:
      - pact-postgres:/var/lib/postgresql/data
      - ../services/api/src/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ${PACT_ENV_FILE:-.env.demo}
    environment:
      NODE_ENV: production
      PORT: 4100
      PACT_MODE: demo
      DATABASE_URL: postgresql://pact:${POSTGRES_PASSWORD:-pact-demo-only}@postgres:5432/pact
      PACT_CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
      PACT_ENABLE_DEMO_ENDPOINTS: "true"
      PACT_ALLOW_DETERMINISTIC_PROVIDERS: "true"
      ARENA_JUDGE_PROVIDER: deterministic
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  arena-agent:
    build:
      context: ..
      dockerfile: Dockerfile.agent
    env_file:
      - ${PACT_ENV_FILE:-.env.demo}
    environment:
      NODE_ENV: production
      PACT_API_URL: http://api:4100
      PACT_ARENA_POLL_INTERVAL_MS: "30000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pact-postgres:
