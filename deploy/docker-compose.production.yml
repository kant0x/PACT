services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pact
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
    volumes:
      - pact-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  arena-docker:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--tls=false"]
    volumes:
      - arena-docker-data:/var/lib/docker
    networks:
      - runner
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ${PACT_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 4100
      PACT_MODE: arc
      PACT_DATABASE_URL: postgres://pact:${POSTGRES_PASSWORD}@postgres:5432/pact
      PACT_CORS_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN in deploy/.env.production}
      PACT_ENABLE_DEMO_ENDPOINTS: "false"
      PACT_REQUIRE_AGENT_SIGNATURES: "true"
      PACT_REQUIRE_ARENA_SIGNATURES: "true"
      PACT_AGENT_AUTOPILOT_ENABLED: "true"
      ARENA_JUDGE_PROVIDER: openai
      ARBITRATOR_PROVIDER: council
      ARBITRATOR_FALLBACK: disabled
      DOCKER_HOST: tcp://arena-docker:2375
    depends_on:
      postgres:
        condition: service_healthy
      arena-docker:
        condition: service_healthy
    networks:
      - default
      - runner
    restart: unless-stopped

  indexer:
    build:
      context: ..
      dockerfile: Dockerfile.indexer
    env_file:
      - ${PACT_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PACT_DATABASE_URL: postgres://pact:${POSTGRES_PASSWORD}@postgres:5432/pact
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: ""
        VITE_PACT_MODE: arc
        VITE_AUTO_SEED_DEMO: "false"
        VITE_REQUIRE_ARENA_SIGNATURES: "true"
    environment:
      PACT_WEB_API_URL: ""
      PACT_WEB_MODE: arc
      PACT_WEB_ARC_RPC_URL: ${PACT_ARC_RPC_URL:-https://rpc.testnet.arc.network}
      PACT_WEB_STREAMING_VAULT_ADDRESS: ${PACT_STREAMING_VAULT_ADDRESS:?Set PACT_STREAMING_VAULT_ADDRESS}
      PACT_WEB_USDC_ADDRESS: ${ARC_USDC_ADDRESS:-0x3600000000000000000000000000000000000000}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

networks:
  runner:
    driver: bridge

volumes:
  pact-postgres:
  arena-docker-data:
