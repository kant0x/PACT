services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pact
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env.production}
    volumes:
      - pact-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ${PACT_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 4100
      PACT_MODE: arc
      PACT_DATABASE_URL: postgres://pact:${POSTGRES_PASSWORD}@postgres:5432/pact
      PACT_CORS_ORIGINS: ${PACT_CORS_ORIGINS:?Set PACT_CORS_ORIGINS in deploy/.env.production}
      PACT_REQUIRE_ARENA_SIGNATURES: "true"
      PACT_AGENT_AUTOPILOT_ENABLED: "true"
      ARENA_JUDGE_PROVIDER: openai
      ARBITRATOR_PROVIDER: council
      ARBITRATOR_FALLBACK: disabled
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  indexer:
    build:
      context: ..
      dockerfile: Dockerfile.indexer
    env_file:
      - ${PACT_ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PACT_DATABASE_URL: postgres://pact:${POSTGRES_PASSWORD}@postgres:5432/pact
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    env_file:
      - ${PACT_ENV_FILE:-.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - pact-caddy-data:/data
      - pact-caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: ""
        VITE_ARC_RPC_URL: ${PACT_ARC_RPC_URL:-https://rpc.testnet.arc.network}
        VITE_STREAMING_VAULT_ADDRESS: ${PACT_STREAMING_VAULT_ADDRESS:?Set PACT_STREAMING_VAULT_ADDRESS}
        VITE_AGENT_REGISTRY_ADDRESS: ${PACT_AGENT_REGISTRY_ADDRESS:?Set PACT_AGENT_REGISTRY_ADDRESS}
        VITE_REPUTATION_REGISTRY_ADDRESS: ${PACT_REPUTATION_REGISTRY_ADDRESS:?Set PACT_REPUTATION_REGISTRY_ADDRESS}
        VITE_WORK_ORDER_COMMITMENTS_ADDRESS: ${PACT_WORK_ORDER_COMMITMENTS_ADDRESS:?Set PACT_WORK_ORDER_COMMITMENTS_ADDRESS}
        VITE_VERIFICATION_REGISTRY_ADDRESS: ${PACT_VERIFICATION_REGISTRY_ADDRESS:?Set PACT_VERIFICATION_REGISTRY_ADDRESS}
        VITE_HUB_REGISTRY_ADDRESS: ${PACT_HUB_REGISTRY_ADDRESS:?Set PACT_HUB_REGISTRY_ADDRESS}
        VITE_MILESTONE_ESCROW_ADDRESS: ${PACT_MILESTONE_ESCROW_ADDRESS:?Set PACT_MILESTONE_ESCROW_ADDRESS}
        VITE_SUBSCRIPTION_VAULT_ADDRESS: ${PACT_SUBSCRIPTION_VAULT_ADDRESS:?Set PACT_SUBSCRIPTION_VAULT_ADDRESS}
        VITE_REWARD_VAULT_ADDRESS: ${PACT_REWARD_VAULT_ADDRESS:?Set PACT_REWARD_VAULT_ADDRESS}
        VITE_USDC_ADDRESS: ${ARC_USDC_ADDRESS:-0x3600000000000000000000000000000000000000}
    environment:
      PACT_WEB_API_URL: ""
      PACT_WEB_ARC_RPC_URL: ${PACT_ARC_RPC_URL:-https://rpc.testnet.arc.network}
      PACT_WEB_STREAMING_VAULT_ADDRESS: ${PACT_STREAMING_VAULT_ADDRESS:?Set PACT_STREAMING_VAULT_ADDRESS}
      PACT_WEB_AGENT_REGISTRY_ADDRESS: ${PACT_AGENT_REGISTRY_ADDRESS:?Set PACT_AGENT_REGISTRY_ADDRESS}
      PACT_WEB_REPUTATION_REGISTRY_ADDRESS: ${PACT_REPUTATION_REGISTRY_ADDRESS:?Set PACT_REPUTATION_REGISTRY_ADDRESS}
      PACT_WEB_WORK_ORDER_COMMITMENTS_ADDRESS: ${PACT_WORK_ORDER_COMMITMENTS_ADDRESS:?Set PACT_WORK_ORDER_COMMITMENTS_ADDRESS}
      PACT_WEB_VERIFICATION_REGISTRY_ADDRESS: ${PACT_VERIFICATION_REGISTRY_ADDRESS:?Set PACT_VERIFICATION_REGISTRY_ADDRESS}
      PACT_WEB_HUB_REGISTRY_ADDRESS: ${PACT_HUB_REGISTRY_ADDRESS:?Set PACT_HUB_REGISTRY_ADDRESS}
      PACT_WEB_MILESTONE_ESCROW_ADDRESS: ${PACT_MILESTONE_ESCROW_ADDRESS:?Set PACT_MILESTONE_ESCROW_ADDRESS}
      PACT_WEB_SUBSCRIPTION_VAULT_ADDRESS: ${PACT_SUBSCRIPTION_VAULT_ADDRESS:?Set PACT_SUBSCRIPTION_VAULT_ADDRESS}
      PACT_WEB_REWARD_VAULT_ADDRESS: ${PACT_REWARD_VAULT_ADDRESS:?Set PACT_REWARD_VAULT_ADDRESS}
      PACT_WEB_USDC_ADDRESS: ${ARC_USDC_ADDRESS:-0x3600000000000000000000000000000000000000}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pact-postgres:
  pact-caddy-data:
  pact-caddy-config:
