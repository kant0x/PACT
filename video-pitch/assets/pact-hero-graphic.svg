      <stop stop-color="#FFFDF8"/>
      <stop offset="0.52" stop-color="#D9D4CE"/>
      <stop offset="1" stop-color="#807A75"/>
    </linearGradient>
    <linearGradient id="ember" x1="126" y1="408" x2="563" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B94D2B"/>
      <stop offset="0.48" stop-color="#F07A49"/>
      <stop offset="1" stop-color="#9A3C21"/>
    </linearGradient>
    <linearGradient id="edge" x1="262" y1="451" x2="544" y2="233" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9A67"/>
      <stop offset="1" stop-color="#C4532E"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(377 315) rotate(90) scale(284 310)" gradientUnits="userSpaceOnUse">
