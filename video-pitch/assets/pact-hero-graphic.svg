    <filter id="softShadow" x="55" y="69" width="586" height="492" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity="0.82"/>
    </filter>
    <filter id="emberGlow" x="68" y="151" width="548" height="412" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
